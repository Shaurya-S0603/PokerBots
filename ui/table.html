<section class="room" aria-label="No-Limit Texas Hold'em poker table">
  <div class="room__topline">
    <div class="room__identity"><span class="room__brand">POKERROOM</span><span class="room__divider">/</span><span>Hand __HAND__</span></div>
    <span class="room__phase" aria-label="Current betting phase: __PHASE_LABEL__">__PHASE_LABEL__</span>
  </div>
  <div class="table-stage">
    <div class="felt-surface">
      <div class="felt-inner">
        <div class="pot-caption">TOTAL POT</div>
        <div class="pot-value" aria-label="Total pot __POT__ chips">__POT__ <span>chips</span></div>
        <div class="board-row" role="group" aria-label="Community cards">__BOARD__</div>
        <div class="felt-caption">__STATUS__</div>
      </div>
    </div>
    <div class="seats" aria-label="Player seats">__SEATS__</div>
  </div>
  <div class="room__bottomline"><span>BLINDS __BLINDS__</span><span>__PLAYERS_LEFT__ PLAYERS REMAINING</span></div>
</section>
