name: Chipzen upload
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ashwing_sdk/**'
      - '.github/workflows/chipzen-image.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - policy: One Above All
            slug: one-above-all
          - policy: Hive Mind
            slug: hive-mind
    env:
      BOT_POLICY: ${{ matrix.policy }}
      BOT_SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: docker build --platform linux/amd64 -f ashwing_sdk/Dockerfile.chipzen --build-arg "POKERBOTS_STRATEGY=$BOT_POLICY" -t "pokerbots-$BOT_SLUG:chipzen" ashwing_sdk
      - name: Check sandbox user and mock matches inside the image
        run: |
          test "$(docker run --rm --network none --entrypoint id "pokerbots-$BOT_SLUG:chipzen" -u)" = 10001
          docker run --rm --network none --read-only --entrypoint python \
            -v "$PWD/ashwing_sdk/tests/chipzen_conformance.py:/bot/tests/chipzen_conformance.py:ro" \
            "pokerbots-$BOT_SLUG:chipzen" /bot/tests/chipzen_conformance.py "$BOT_POLICY"
      - name: Export the upload archive
        run: |
          test "$(docker image inspect --format '{{.Size}}' "pokerbots-$BOT_SLUG:chipzen")" -le 200000000
          docker save "pokerbots-$BOT_SLUG:chipzen" | gzip > "pokerbots-$BOT_SLUG-chipzen.tar.gz"
          gzip -t "pokerbots-$BOT_SLUG-chipzen.tar.gz"
          test "$(wc -c < "pokerbots-$BOT_SLUG-chipzen.tar.gz")" -le 250000000
      - uses: actions/upload-artifact@v4
        with:
          name: pokerbots-${{ matrix.slug }}-chipzen
          path: pokerbots-${{ matrix.slug }}-chipzen.tar.gz
          if-no-files-found: error
          compression-level: 0
