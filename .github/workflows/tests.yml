name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r ashwing_sdk/requirements-chipzen.txt
      - run: python -m pytest -q
      - run: python ashwing_sdk/tests/chipzen_conformance.py Ashwing_V4
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python streamlit_app/tests/browser/table_smoke.py
